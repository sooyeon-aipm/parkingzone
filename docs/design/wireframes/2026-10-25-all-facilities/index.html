hite-space:nowrap;font-size:19px;color:#27313a}.pin:after{content:'';position:absolute;top:100%;left:45%;border-top:8px solid currentColor;border-left:6px solid transparent;border-right:6px solid transparent}.pin.partner{background:#00a6f3;color:white;border-color:#008fda}.pin.selected{background:#075780;color:white;border-color:#075780}.pin .type{width:20px;height:20px;font-size:8px;border:0}.sheet{position:absolute;bottom:0;left:0;right:0;background:white;border-radius:18px 18px 0 0;display:flex;flex-direction:column;height:100%;overflow:hidden}.peek .sheet{height:360px}.full .sheet{border-radius:0}.handle{width:35px;height:4px;border-radius:4px;background:#e5e9ed;margin:10px auto 14px;flex-shrink:0}.identity{padding:0 14px 10px;flex-shrink:0;background:white;z-index:6}.name-row{display:flex;align-items:center;gap:6px}.name{font-size:14px;font-weight:700;line-height:1.4;flex:1;min-width:0}.peek .name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.badge{font-size:9px;white-space:nowrap;background:#3a9169;color:#fff;border-radius:3px;padding:2px 4px}.route{background:#00a6f3;color:white;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0}.updated{text-align:center;font-size:10px;color:#8e9ba8;margin-top:5px}.meta{font-size:11px;color:#7d8890;margin-top:7px}.full .name-row{justify-content:center}.full .name{flex:initial;text-align:center}.body{padding:0 14px 28px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.functions{display:flex;justify-content:space-around;color:#53a3ce;font-size:10px;text-align:center;padding:3px 0 13px}.functions span:before{content:attr(data-icon);display:grid;place-items:center;border:1px solid #64afe0;width:32px;height:32px;border-radius:50%;font-size:19px;margin-bottom:2px}.status{padding:10px;background:#f0f5f8;border-radius:7px;margin-bottom:9px;position:sticky;top:0;z-index:5;box-shadow:0 -2px 0 2px white,0 2px 0 2px white}.status-head{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:650}.status strong{font-size:22px;display:block;margin-top:4px}.status strong small{font-size:10px;font-weight:400}.status p{font-size:9px;color:#80909b}.sample{font-size:9px;color:#937431;margin-top:3px}.banner{background:#fff17b;padding:10px;border-radius:5px;text-align:center;font-size:12px;line-height:1.5;margin:0 0 10px}.product{border:1px solid #2ba8ed;border-radius:7px;padding:13px;margin-bottom:10px}.product h3{font-size:14px;margin:0 0 5px;line-height:1.4}.price-row{display:flex;align-items:center;justify-content:space-between;gap:6px}.price-row b{font-size:22px;white-space:nowrap}.buy{background:#00a5f5;color:white;border:1px solid #00a5f5;border-radius:4px;padding:7px 10px;font-size:11px;white-space:nowrap}.hours{color:#747f87;font-size:12px;margin:5px 0 0}.unavailable{border-color:#d4d4d4}.unavailable .buy{background:white;border-color:#333;color:#333}.all{text-align:center;padding:12px 0 22px;color:#53a3ce}.info{border-top:1px solid #e6ebef;padding:16px 0;font-size:12px}.info h3{font-size:14px;margin:0 0 8px}.onsite{font-size:12px}.onsite>p{display:flex;justify-content:space-between;padding:7px 0}.onsite b{font-size:15px}.unsupported{background:#f6f6f6;text-align:center;padding:12px 5px;color:#94999e;font-size:11px;border-radius:5px;margin:10px 0}.request{background:#00a5f5;color:#fff;text-align:center;padding:12px;border-radius:5px;font-size:13px;margin-bottom:15px}.close{position:absolute;right:10px;bottom:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fffffff0;color:#8a969f;font-size:24px;z-index:8}.notes{max-width:1140px;margin-top:20px;padding:16px;background:#fff;border-radius:12px}.notes a{color:#1686c3}.off .sheet{display:none}.pending{color:#95672b;font-size:11px}.sub{font-size:12px;color:#7b8894}.pill{border:1px solid #d8e0e6;border-radius:18px;padding:5px 10px}.selected-demo{border-color:#00a6f3;background:#eef9ff} @media(max-width:850px){.flow{grid-template-columns <h1>15곳 원본 대조 · 모바일 화면 스케치</h1><p class="sub">2026-10-25 원본 관찰·사용자 결정 반영 / 구현 전 검토용 · 혼잡도·갱신 시각·잔여 면수는 배치 예시, 실시간 데이터 아님</p>
<div class="toolbar"><label>주차장 <select id="facility"></select></label><button id="previous">이전</button><button id="next">다음</button><button id="source">원본 캡처</button></div>
<div class="legend"><span class="type partner">제휴</span><span>앱 주차권</span><span class="type">공영</span><span class="type">민영</span><span>현장 시간요금</span><span class="sub">지도 금액: 현장 1시간 기본요율 · 무료시간/할인 별도</span><button id="selection" class="pill selected-demo">선택 해제 보기</button><span class="sub">말풍선 클릭 ↔ 시트 내려 선택 해제: 원래 색상 복원</span></div>
<div class="flow" id="flow"></div><div class="notes" id="notes"></div>
<script>
let records=[],current=0,selected=true;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>n.toLocaleString('ko-KR');const type=l=>`<span class="type ${l.kind==='제휴'?'partner':''}">${l.kind}</span>`;
function status(l,full){return `<section class="status"><div class="status-head">${full?type(l):''}주차장 현재 상태</div><strong>—면 <small>/ 전체 ${l.total??'—'}면</small></strong><p>갱신 시점 기준이며, 도착 시 자리는 보장되지 않아요.</p><div class="sample">배치 예시 · 실제 잔여 면수는 DB에서 연결</div></section>`}
function products(l){if(!l.products.length)return `<div class="onsite"><p><span>주차요금</span><b>${esc(l.fee)}</b></p><p><span>운영시간</span><b>${esc(l.oper)}</b></p></div><div class="unsupported">앱 결제를 지원하지 않는 주차장입니다</div><div class="request">여기도 이용권 만들어 주세요</div>`;return l.products.map(p=>`<article class="product ${p.available?'':'unavailable'}"><h3>${esc(p.name)}</h3><div class="price-row"><b>${money(p.price)}원</b><span class="buy">구매하기</span></div><p class="hours">${esc(p.hours)}</p></article>`).join('')+'<div class="all">이용권 모두보기</div>'}
function render(){let l=records[current];$('#facility').value=current;$('#selection').textContent=selected?'선택 해제 보기':'다시 선택 보기';$('#flow').innerHTML=[['① 선택 직후','peek'],['② 끌어올리면','full'],['③ 더 스크롤하면','full scrolled']].map(([title,cls],i)=>`<section class="step"><h2>${title}</h2><div class="phone ${cls} ${i===0&&!selected?'off':''}"><div class="map"></div>${i===0?`<div class="search"><p>⌕ 목적지 또는 주소 검색</p><div class="filters"><span>오늘 · 1시간</span><span>월주차</span><span>세차</span></div></div><button class="pin ${l.kind==='제휴'?'partner':''} ${selected?'selected':''}">${l.kind==='제휴'?type(l):''}${l.marker===null?'금액 확인 대기':money(l.marker)}</button>`:''}<div class="sheet"><div class="handle"></div><header class="identity"><div class="name-row">${i===0?type(l):''}<span class="badge">여유</span><span class="name" title="${esc(l.name)}">${esc(l.name)}</span>${i===0?'<span class="route">➜</span>':''}</div><p class="updated">갱신 --:-- <span class="sample">배치 예시</span></p>${i===0?`<p class="meta">${l.total===null?'':l.total+'면'}${l.card?' | 카드결제':''}</p>`:''}</header><div class="body">${i===1?'<div class="functions"><span data-icon="↥">전달</span><span data-icon="✎">수정요청</span><span data-icon="☆">즐겨찾기</span><span data-icon="➜">내비</span></div>':''}${status(l,i>0)}${i===2?'':l.banner?`<div class="banner">${esc(l.banner)}</div>`:''}${i===2?'<p class="sub">↑ 기능·안내 배너는 위로 스크롤됨</p>':''}${products(l)}<section class="info"><p>⌖ ${esc(l.address)}</p><h3>시간요금</h3><p>${esc(l.fee)}</p><p class="sub">출처에서 확인한 값만 반영 · 정보 미확인은 임의 보충하지 않음</p></section></div>${i>0?'<span class="close">×</span>':''}</div></div></section>`).join('');$('#notes').innerHTML=`<b>${l.i}번 · ${esc(l.name)}</b><p>${l.kind} · ${l.total===null?'원본 면수 미표시':l.total+'면'} · 서울시와 앱 이름·주소를 별도로 보존</p><p>${l.marker===null?'<span class="pending">이 시설의 지도 가격 연결은 미확인. 주변 말풍선 값을 임의로 넣지 않음.</span>':'지도 '+money(l.marker)+'원은 현장 1시간 기준 요금. 상품 가격·원본 지도 표시값과 구분하며 무료시간·할인은 별도.'}</p><p>① 제휴 상품형은 첫 상품 금액 아래까지만 초기 노출. 공영·민영 시간요금형은 사용자 확정대로 시간요금·운영시간까지 초기 노출.</p><p>②·③ 제목/갱신 시각 고정, 유형 아이콘은 상태 제목 왼쪽. 상태 박스 전체 고정. 원본 ‘유형 | 면수’ 줄은 제거하고 전체 면수는 상태 박스 안에만 표시.</p><p>회색 상품은 관찰 날짜에 이용 불가. 표기된 이용시간·가격을 미래 날짜에도 적용한다는 의미가 아님.</p>`;document.querySelector('.pin')?.addEventListener('click',()=>{selected=!selected;render()});requestAnimationFrame(()=>{let phone=document.querySelector('.peek'),sheet=phone.querySelector('.sheet'),price=sheet.querySelector('.price-row b'),end=price??sheet.querySelector('.onsite');if(end)sheet.style.height=Math.ceil(end.getBoundingClientRect().bottom-sheet.getBoundingClientRect().top+4)+'px';});}
fetch('observations.json').then(r=>r.json()).then(data=>{records=data;$('#facility').innerHTML=records.map((l,i)=>`<option value="${i}">${l.i}. ${esc(l.name)}</option>`).join('');render()});$('#facility').onchange=e=>{current=Number(e.target.value);selected=true;render()};$('#previous').onclick=()=>{current=(current+14)%15;render()};$('#next').onclick=()=>{current=(current+1)%15;render()};$('#selection').onclick=()=>{selected=!selected;render()};$('#source').onclick=()=>{let i=records[current].i;window.open(i===5?'../2026-10-25-bottom-sheet/source-original.png':i===13?'evidence/centerpoint-selected.png':i===15?'evidence/15-selected.png':`evidence/${String(i).padStart(2,'0')}-selected.png`,'_blank')};
</script></html>
