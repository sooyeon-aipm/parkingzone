<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모두의주차장</title><link rel="stylesheet" href="styles.css"></head>
<body>

<main class="phone" aria-label="모바일 프로토타입">
<div class="statusbar"><span>12:00 ▰</span><span>▂▄▆　◉ ▰</span></div>
<section class="map" aria-label="성수동 네이버 지도"><div id="naver-map" aria-label="주차장 지도"></div><p id="map-error" hidden>지도를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p><div class="map-switches"><button data-unsupported="공유면 탐색" aria-label="공유면 탐색 범위 안내">공유<b>ON</b></button><button id="ticket-toggle" aria-pressed="true">주차권<b>ON</b></button></div><div class="zoom"><button id="zoom-in" aria-label="지도 확대">＋</button><button id="zoom-out" aria-label="지도 축소">−</button></div><button id="recenter" class="locate" aria-label="지도 초기 위치">◎</button></section>
<header id="map-header" class="floating-header"><button id="open-search" class="search-prompt">⌕ <span id="destination-label">목적지 또는 주소 검색</span></button><button class="ai" data-unsupported="AI 음성 검색">♩ AI</button><div class="filters"><button class="filter-icon" data-unsupported="상세 필터">☷</button><button id="open-date" class="active">오늘 · 1시간</button><button data-unsupported="월주차">월주차</button><button data-unsupported="세차">♧ 세차</button></div></header>
<div id="home-footer" class="home-footer"><button id="open-list" class="open-list">🅿 오늘 주차권 <span>⌃</span></button><nav><button data-unsupported="내 공유">📍 내 공유</button><button data-unsupported="즐겨찾기">★ 즐겨찾기</button><button data-unsupported="내 이용권">▣ 내 이용권</button></nav><div class="ad-example"><small>모두의주차장</small><strong>모두의주차장</strong><span>주차장 정보와 이용 조건을 확인하세요　›</span></div></div>
<section id="results" class="sheet list-sheet" aria-label="주차권 비교 목록" hidden><button class="sheet-handle" id="close-list" aria-label="지도 보기"></button><div class="category-row"><button class="active" data-category="제안">👍 제안</button><button data-category="당일권">당일권</button><button data-category="시간권">시간권</button><button data-category="야간권">야간권</button><button data-category="연박권">연박권</button></div><p id="distance-basis" class="distance-basis"></p><div class="sort-row"><button id="sort-distance" class="active">✓ 이름순</button><button id="sort-price">✓ 가격순</button><button id="search-here">⟳ 현위치 재검색</button></div><div class="list-scroll" id="parking-list"></div></section>
<section id="detail" class="sheet detail-sheet" aria-label="상품 상세" hidden><button class="sheet-handle" id="expand" aria-label="상품 상세 펼치기" aria-expanded="false"></button><div class="detail-nav"><button id="back" aria-label="비교 목록으로 돌아가기">〈</button><div class="detail-identity"><button id="detail-heading" aria-label="상품 상세 펼치기"></button><p id="detail-updated" class="detail-updated" hidden></p></div></div><div id="detail-content" class="detail-scroll"></div><div class="purchase-area"><button id="purchase" class="purchase">구매하기</button></div></section>
<section id="search-screen" class="full-screen" aria-label="목적지 검색" hidden><form id="search-form"><button id="close-search" type="button" aria-label="검색 닫기">〈</button><input id="search" placeholder="목적지 또는 주소 검색" autocomplete="off" aria-label="목적지 또는 주소 검색"><button type="submit">검색</button></form><div class="search-tabs"><strong>통합검색</strong><span>최근 검색</span></div><p class="search-help">성수동 또는 주차장 이름을 검색해 보세요.</p><div id="search-results"></div></section>
<section id="date-screen" class="modal-layer" aria-label="날짜 및 이용시간" hidden><div class="date-sheet"><h2>날짜 및 이용시간</h2><div class="month"><strong>2026년 10월</strong><span>〈　〉</span></div><div class="calendar" id="calendar"></div><h3>주차 예정 시간</h3><div id="durations" class="durations"></div><div class="date-actions"><button id="close-date">닫기</button><button id="confirm-date">선택 완료</button></div></div></section>
<section id="completion" class="full-screen completion" aria-label="테스트 종료" hidden><div class="done-icon">✓</div><h2>테스트가 끝났습니다</h2><p>선택 결과를 이 브라우저에 기록했어요.</p><div id="completion-detail"></div><p class="completion-note">실제 구매·예약·결제는 진행되지 않았습니다.</p><button id="restart" class="purchase">다시 테스트하기</button></section><div id="toast" class="toast" role="status" hidden></div><p id="load-message" role="status">데이터를 불러오고 있습니다.</p>
</main><script type="module" src="app.js"></script></body></html>
